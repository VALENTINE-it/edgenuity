# Nginx Reverse Proxy Configuration for Edgenuity
# Architecture: Cloudflare -> Nginx -> Puma (Ruby on Rails) -> SQLite3 WAL

upstream puma_edgenuity {
  server 127.0.0.1:3000 fail_timeout=0;
  keepalive 32;
}

# HTTP to HTTPS redirect
server {
  listen 80;
  listen [::]:80;
  server_name yourportfolio.com www.yourportfolio.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS server
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name yourportfolio.com www.yourportfolio.com;

  root /rails/public;

  # SSL Configuration
  ssl_certificate /etc/letsencrypt/live/yourportfolio.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/yourportfolio.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Request Limits & Timeouts
  client_max_body_size 1M;
  client_body_timeout 15s;
  client_header_timeout 10s;
  keepalive_timeout 65s;
  send_timeout 15s;

  # Gzip Compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_vary on;
  gzip_min_length 1000;

  # Security Headers (synchronized with application headers)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # Static Assets Caching
  location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri @puma;
  }

  # Health Check Bypass
  location /health/ {
    proxy_pass http://puma_edgenuity;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
  }

  # Main Application Proxy
  location / {
    try_files $uri @puma;
  }

  location @puma {
    proxy_pass http://puma_edgenuity;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering on;
  }
}
